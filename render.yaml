# LunArt — private preview
#
# A blueprint for one long-running Node service: the real server, the real routes,
# the real scheduler. Not a rewrite into serverless functions, because the thing
# being previewed is a server that keeps state and runs jobs on intervals.
#
# `LUNART_PREVIEW=1` is the whole safety story. It is read in `server/config.js`
# before anything else, and it does not merely default things to safe values — it
# refuses to read the dangerous ones at all. A live Stripe key, a Gmail refresh
# token or a calendar service account pasted into this service by mistake is
# ignored: payments run on the built-in stand-in, no email leaves, no mailbox is
# read and no calendar is written.
#
# Two values are generated by Render, so nobody has to invent or share them:
# the Staff token and the Privilege Card signing key. Read the Staff token once in
# the dashboard under Environment.
#
# This deploys the `fable/guest-guide-v2` branch. It does not touch `main`, and it
# has nothing to do with the GitHub Pages site, which is published separately and
# stays exactly as it is.

services:
  - type: web
    name: lunart-preview
    runtime: node
    plan: free
    region: frankfurt          # closest to Florence; change freely
    branch: fable/guest-guide-v2
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Demonstration mode. Everything below depends on this being "1".
      - key: LUNART_PREVIEW
        value: "1"

      # Production mode has one effect that matters here: the Staff API refuses
      # every request unless a token is configured, rather than falling open the way
      # a development server does.
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      # Generated by Render, visible once in the dashboard. Nobody types it, nobody
      # commits it, and it is long enough that nobody guesses it.
      - key: STAFF_TOKEN
        generateValue: true

      # Also generated: without it the server makes one at boot, and every restart
      # would invalidate every Privilege Card issued in the demo.
      - key: CARD_SIGNING_KEY
        generateValue: true

      # Every loop that reaches outside stays off. Housekeeping only retires stays
      # that have already ended, which is local and harmless.
      - key: RESERVATION_POLL_MINUTES
        value: "0"
      - key: DELIVERY_POLL_MINUTES
        value: "0"
      - key: ICAL_POLL_MINUTES
        value: "0"
      - key: HOUSEKEEPING_MINUTES
        value: "60"

      # QUOVAI_ICAL_FEEDS is deliberately absent, and it is the one value LunArt is
      # still waiting on from outside.
      #
      # The calendar safety net is built and tested; what it has no way to invent is
      # a feed URL. Add it as `301:https://…,302:https://…` — one export per room,
      # prefixed with the room it belongs to — and set ICAL_POLL_MINUTES to 15. The
      # Staff app's sync screen says which is missing, and "Esamina i feed" reads
      # one without writing anything, which is the right first thing to do with a
      # URL nobody here has seen yet.
      #
      # Nothing happens until both are set: with no feed the reconciliation refuses
      # and says so, rather than reporting a clean comparison of nothing.

      # PUBLIC_URL is deliberately absent: the server falls back to
      # RENDER_EXTERNAL_URL, so the personal guide links are built from the address
      # this service actually has.
