function faqAnswer(input, lang) {
  const q = input.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  let best = null, bestScore = 0;
  for(const f of FAQ){
    let score = 0;
    for(const kw of f.k){
      const k = kw.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
      if(q.includes(k)) score += k.length;
    }
    if(score > bestScore){bestScore=score; best=f;}
  }
  if(best && bestScore >= 3) return best[lang]||best.it;
  return lang==="it"
    ? "Non ho trovato una risposta precisa a questa domanda. 😊\n\nPer assistenza diretta contatta:\n📱 Jacopo: **+39 392 472 5263** (WhatsApp)\n✉️ **lunartfirenze@gmail.com**"
    : "I couldn't find a precise answer to this. 😊\n\nFor direct assistance contact:\n📱 Jacopo: **+39 392 472 5263** (WhatsApp)\n✉️ **lunartfirenze@gmail.com**";
}

function Chatbot({lang,onClose}){
  const tr=T[lang].chat;
  const [msgs,setMsgs]=React.useState([{isUser:false,text:tr.welcome}]);
  const [input,setInput]=React.useState("");
  const ref=React.useRef(null);
  React.useEffect(()=>{ref.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  function send(){
    if(!input.trim())return;
    const q=input;
    setInput("");
    const answer=faqAnswer(q,lang);
    setMsgs(p=>[...p,{isUser:true,text:q},{isUser:false,text:answer}]);
  }

  function formatText(text){
    return text.split("\n").map((line,i)=>{
      const parts=line.split(/\*\*([^*]+)\*\*/g);
      return React.createElement("span",{key:i,style:{display:"block",marginBottom:line===""?8:2}},
        parts.map((p,j)=>j%2===1?React.createElement("strong",{key:j},p):p)
      );
    });
  }

  return(
    <div style={{position:"fixed",bottom:90,right:20,width:340,maxWidth:"calc(100vw - 40px)",height:480,background:"#faf9f7",border:"1px solid #1a1a1a",boxShadow:"0 24px 64px rgba(0,0,0,0.22)",display:"flex",flexDirection:"column",zIndex:1000,animation:"slideUp .25s ease"}}>
      <div style={{background:"#1a1a1a",color:"#faf9f7",padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,letterSpacing:2}}>{tr.title}</div>
          <div style={{fontSize:10,opacity:.4,letterSpacing:2,marginTop:2}}>FIRENZE · Assistente virtuale</div>
        </div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#faf9f7",fontSize:22,cursor:"pointer",opacity:.7}}>×</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:10}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{alignSelf:m.isUser?"flex-end":"flex-start",maxWidth:"88%",background:m.isUser?"#1a1a1a":"#ede9e3",color:m.isUser?"#faf9f7":"#1a1a1a",padding:"10px 14px",fontSize:13,lineHeight:1.6,borderRadius:m.isUser?"14px 14px 2px 14px":"14px 14px 14px 2px"}}>
            {m.isUser?m.text:formatText(m.text)}
          </div>
        ))}
        <div ref={ref}/>
      </div>
      <div style={{display:"flex",borderTop:"1px solid #ddd",padding:"10px 12px",gap:8}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder={tr.ph} style={{flex:1,border:"1px solid #ccc",padding:"9px 12px",fontSize:12,outline:"none",background:"#fff",fontFamily:"inherit"}}/>
        <button onClick={send} style={{background:"#1a1a1a",color:"#faf9f7",border:"none",padding:"9px 14px",fontSize:11,cursor:"pointer"}}>{tr.send}</button>
      </div>
    </div>
  );
}

function App(){

  const [vis,setVis]=useState(new Set());
  const tr=T[lang];

  useEffect(()=>{
    const fn=()=>setScrolled(window.scrollY>50);
    window.addEventListener("scroll",fn);return()=>window.removeEventListener("scroll",fn);
  },[]);
  useEffect(()=>{
    const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)setVis(s=>new Set([...s,e.target.dataset.v]));}),{threshold:.1});
    document.querySelectorAll("[data-v]").forEach(el=>obs.observe(el));
    return()=>obs.disconnect();
  },[]);

  const fi=(id,d=0)=>({opacity:vis.has(id)?1:0,transform:vis.has(id)?"none":"translateY(24px)",transition:`opacity .75s ease ${d}s,transform .75s ease ${d}s`});

  return(
    <div style={{fontFamily:"'DM Sans',sans-serif",background:"#faf9f7",color:"#1a1a1a"}}>

      {/* NAV */}
      <nav style={{position:"fixed",top:0,left:0,right:0,zIndex:200,height:64,background:scrolled?"rgba(250,249,247,0.96)":"transparent",backdropFilter:scrolled?"blur(12px)":"none",borderBottom:scrolled?"1px solid rgba(26,26,26,0.08)":"none",transition:"all .3s",padding:"0 40px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span onClick={()=>window.scrollTo({top:0,behavior:"smooth"})} style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,fontWeight:500,letterSpacing:4,cursor:"pointer"}}>LunArt</span>
        <div className="nav-links" style={{display:"flex",gap:22,alignItems:"center"}}>
          {["about","rooms","services","partners","contact"].map(k=>(

      {/* SERVICES */}
      <section id="services" style={{padding:"90px 40px"}}>
        <div data-v="svh" style={{textAlign:"center",marginBottom:48,...fi("svh")}}>
          <p className="sec-label">{tr.services.label}</p>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(26px,4vw,46px)",fontWeight:300}}>{tr.services.title}</h2>
        </div>
        <div data-v="svl" style={{maxWidth:960,margin:"0 auto",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:2,...fi("svl",.1)}} className="services-grid">
          {tr.services.list.map((s,i)=>(
            <div key={i} style={{background:"#f2ede6",padding:"24px 22px"}}>
              <div style={{fontSize:24,marginBottom:10}}>{s.i}</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:17,fontWeight:400,marginBottom:6}}>{s.t}</div>
              <div style={{fontSize:12,lineHeight:1.6,opacity:.6,fontWeight:300}}>{s.d}</div>
            </div>
          ))}
        </div>
      </section>

      {/* CHECK-IN */}
      <section style={{background:"#1a1a1a",color:"#faf9f7",padding:"90px 40px"}}>
        <div data-v="cih" style={{textAlign:"center",marginBottom:56,...fi("cih")}}>
          <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:11,letterSpacing:6,opacity:.35,textTransform:"uppercase",marginBottom:14}}>{tr.checkin.label}</p>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(26px,4vw,46px)",fontWeight:300}}>{tr.checkin.title}</h2>

          {tr.checkin.steps.map((s,i)=>(
            <div key={i} style={{background:"rgba(250,249,247,0.04)",padding:"28px 22px",borderTop:"1px solid rgba(250,249,247,0.1)"}}>
              <div style={{fontSize:10,letterSpacing:3,opacity:.35,textTransform:"uppercase",marginBottom:12}}>{s.time}</div>
              <div style={{fontSize:26,marginBottom:12}}>{s.i}</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontWeight:400,marginBottom:8}}>{s.t}</div>
              <div style={{fontSize:12,lineHeight:1.7,opacity:.55,fontWeight:300}}>{s.d}</div>
            </div>
          ))}
        </div>
      </section>

      {/* PARTNERS */}

              <p style={{fontSize:11,opacity:.45,fontStyle:"italic",marginBottom:14,lineHeight:1.5}}>{p.note}</p>
              {p.via==="lunart"
                ?<a href={`https://wa.me/393924725263`} style={{background:"#faf9f7",color:"#1a1a1a",padding:"8px 14px",fontSize:10,letterSpacing:1,textTransform:"uppercase",textAlign:"center",display:"block"}}>📱 {p.contact}</a>
                :<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <a href={p.web} target="_blank" style={{fontSize:10,background:"#1a1a1a",color:"#faf9f7",padding:"7px 12px",letterSpacing:1}}>Sito →</a>
                  <a href={p.maps} target="_blank" style={{fontSize:10,border:"1px solid rgba(26,26,26,0.2)",padding:"7px 12px",letterSpacing:1}}>📍 Maps</a>
                </div>}
            </div>
          ))}
        </div>
      </section>

      {/* GUEST INFO */}
      <section style={{padding:"80px 40px",background:"#faf9f7"}}>
        <div data-v="info" style={{maxWidth:960,margin:"0 auto",...fi("info")}}>
          <div style={{textAlign:"center",marginBottom:44}}>
            <p className="sec-label">{tr.info.label}</p>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(24px,4vw,44px)",fontWeight:300}}>{tr.info.title}</h2>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:3,marginBottom:3}} className="info-grid">
            {/* WiFi */}
            <div style={{background:"#1a1a1a",color:"#faf9f7",padding:"28px 24px"}}>
              <div style={{fontSize:26,marginBottom:10}}>📶</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,marginBottom:14}}>Wi-Fi</div>
              <div style={{fontSize:10,opacity:.4,letterSpacing:2,textTransform:"uppercase",marginBottom:5}}>Network</div>
              <div style={{fontFamily:"monospace",fontSize:14,marginBottom:14}}>LunArt-Guest</div>
              <div style={{fontSize:10,opacity:.4,letterSpacing:2,textTransform:"uppercase",marginBottom:5}}>Password</div>
              <div style={{fontFamily:"monospace",fontSize:13,background:"rgba(255,255,255,0.1)",padding:"7px 10px"}}>LOPERACAFFE62R</div>
            </div>
            {/* Breakfast */}
            <div style={{background:"#f2ede6",padding:"28px 24px"}}>
              <div style={{fontSize:26,marginBottom:10}}>☕</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,marginBottom:12}}>{lang==="it"?"Colazione":"Breakfast"}</div>
              <p style={{fontSize:12,lineHeight:1.7,opacity:.65,fontWeight:300,marginBottom:12}}>{lang==="it"?"Opera Caffè · P.za Duomo 62R · 8:30–11:00. Mostra la prenotazione.":"Opera Caffè · P.za Duomo 62R · 8:30–11:00am. Show your reservation."}</p>
              <div style={{background:"#1a1a1a",color:"#faf9f7",padding:"8px 12px",fontSize:11}}>🎁 {lang==="it"?"30% sconto al tavolo":"30% off table orders"}</div>
            </div>
            {/* Towels */}
            <div style={{background:"#f2ede6",padding:"28px 24px"}}>
              <div style={{fontSize:26,marginBottom:10}}>🛁</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,marginBottom:10}}>{lang==="it"?"Teli & Biancheria":"Towels & Linen"}</div>
              <p style={{fontSize:12,lineHeight:1.7,opacity:.6,fontStyle:"italic",fontWeight:300,marginBottom:14}}>{lang==="it"?"Ogni lavaggio consuma acqua ed energia. Cambio ogni 3 giorni — su richiesta.":"Every wash uses water and energy. Changed every 3 days — on request."}</p>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6,borderBottom:"1px solid rgba(26,26,26,0.1)",paddingBottom:6}}>
                <span style={{opacity:.65}}>{lang==="it"?"Telo extra (al pezzo)":"Extra towel (per piece)"}</span>
                <span style={{fontWeight:500,textDecoration:"underline",textUnderlineOffset:3}}>€ 5,00</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",fontSize:12,paddingTop:6}}>
                <div><div style={{fontWeight:500}}>{lang==="it"?"Set completo":"Full set"}</div><div style={{fontSize:10,opacity:.5}}>2 grandi · 2 medi · tappetino</div></div>
                <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,fontWeight:500}}>€ 15</span>
              </div>
            </div>
            {/* Save water */}
            <div style={{background:"#e8f2f7",padding:"28px 24px"}}>
              <div style={{fontSize:26,marginBottom:10}}>💧</div>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:19,marginBottom:14}}>Save the Water</div>
              {[lang==="it"?"Chiudi il rubinetto quando non lo usi":"Turn off taps when not in use",
                lang==="it"?"Usa la mezza pressione per uso leggero":"Use partial flush for light use",
                lang==="it"?"Grazie per rispettare l'ambiente 🌿":"Thank you for caring for our planet 🌿"
              ].map((r,i)=>(
                <div key={i} style={{display:"flex",gap:8,fontSize:12,lineHeight:1.6,opacity:.65,marginBottom:6}}>
                  <span style={{opacity:.4}}>{i+1}.</span><span>{r}</span>
                </div>
              ))}
            </div>
          </div>
          {/* ZTL */}
          <div style={{background:"#1a1a1a",color:"#faf9f7",padding:"32px 28px"}}>
            <div style={{marginBottom:24}}>
              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:22,fontWeight:400,marginBottom:6}}>🚗 {tr.ztl.title}</div>
              <div style={{fontSize:11,opacity:.4,letterSpacing:2,textTransform:"uppercase"}}>{tr.ztl.sub}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:16}} className="steps-grid">
              {tr.ztl.steps.map((s,i)=>(
                <div key={i} style={{borderTop:"1px solid rgba(250,249,247,0.12)",paddingTop:14}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontSize:18}}>{s.icon}</span>
                    <span style={{fontFamily:"'Cormorant Garamond',serif",fontSize:16,fontWeight:400}}>{s.t}</span>
                  </div>
                  <p style={{fontSize:12,lineHeight:1.7,opacity:.6,fontWeight:300}}>{s.d}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* BOOKING */}
      <section id="contact" style={{padding:"90px 40px",background:"#f2ede6"}}>
        <div data-v="bk" style={{maxWidth:760,margin:"0 auto",...fi("bk")}}>
          <div style={{textAlign:"center",marginBottom:48}}>
            <p className="sec-label">{tr.booking.label}</p>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(26px,4vw,48px)",fontWeight:300,marginBottom:14}}>{tr.booking.title}</h2>
            <p style={{fontSize:15,opacity:.65,maxWidth:500,margin:"0 auto",lineHeight:1.7,fontWeight:300}}>{tr.booking.sub}</p>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:2,marginBottom:16}} className="contacts-grid">
            {tr.booking.contacts.map((c,i)=>(
              <a key={i} href={c.h} className="hov-lift" style={{background:"#faf9f7",padding:"24px 22px",display:"block"}}>
                <div style={{fontSize:20,marginBottom:8}}>{c.i}</div>
                <div style={{fontSize:10,letterSpacing:2,textTransform:"uppercase",opacity:.45,marginBottom:5}}>{c.l}</div>
                <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:15,fontWeight:400}}>{c.v}</div>
              </a>
            ))}
          </div>
          <div style={{background:"#faf9f7",padding:"12px 16px",fontSize:12,opacity:.6,display:"flex",gap:8,lineHeight:1.6}}>
            <span>ℹ️</span><span>{tr.booking.note}</span>
          </div>
        </div>
      </section>

      {/* POSITION */}
      <section style={{background:"#1a1a1a",color:"#faf9f7",padding:"80px 40px"}}>
        <div data-v="pos" style={{maxWidth:760,margin:"0 auto",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:48,alignItems:"center",...fi("pos")}} className="pos-grid">
          <div>
            <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:11,letterSpacing:6,opacity:.35,textTransform:"uppercase",marginBottom:14}}>{tr.position.label}</p>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:"clamp(24px,4vw,42px)",fontWeight:300,marginBottom:14}}>{tr.position.title}</h2>
            <p style={{fontFamily:"'Cormorant Garamond',serif",fontSize:15,opacity:.45,fontStyle:"italic",marginBottom:24}}>{tr.position.addr}</p>
            <a href="https://goo.gl/maps/mQsN2cY8eihAXVjb8" target="_blank" style={{display:"inline-block",background:"#faf9f7",color:"#1a1a1a",padding:"10px 24px",fontSize:10,letterSpacing:3,textTransform:"uppercase",fontWeight:500}}>Google Maps →</a>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {tr.position.items.map((item,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,fontSize:13,opacity:.6,fontWeight:300}}>
                <div style={{width:4,height:4,background:"#faf9f7",opacity:.35,flexShrink:0}}/>{item}
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer style={{padding:"24px 40px",display:"flex",justifyContent:"space-between",fontSize:11,opacity:.4,borderTop:"1px solid rgba(26,26,26,0.08)",flexWrap:"wrap",gap:8}}>
        <span style={{fontFamily:"'Cormorant Garamond',serif",letterSpacing:3}}>LunArt B&amp;B © 2025</span>
        <span>Vicolo del Canneto 2, Firenze</span>
      </footer>

      {/* CHAT */}
      {!chatOpen&&(
        <button onClick={()=>setChatOpen(true)} style={{position:"fixed",bottom:20,right:20,background:"#1a1a1a",color:"#faf9f7",border:"none",padding:"12px 18px",fontSize:11,letterSpacing:2,textTransform:"uppercase",zIndex:999,boxShadow:"0 4px 20px rgba(0,0,0,0.2)",display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontFamily:"inherit"}}>
          <span style={{fontSize:16}}>💬</span> {tr.chat.btn}
        </button>
      )}
      {chatOpen&&<Chatbot lang={lang} onClose={()=>setChatOpen(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
