name: Return Pass shared-cap tests
on:
  pull_request:
    paths:
      - 'server/return-pass-cap.js'
      - 'server/app.js'
      - 'return-pass.html'
      - 'src/ui/home.js'
      - 'test/return-pass-cap.test.mjs'
      - '.github/workflows/return-pass-cap-ci.yml'
  push:
    branches:
      - 'cash-sprint/shared-hard-cap-oct2026'
jobs:
  shared-cap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/return-pass-cap.test.mjs
      - run: npm test
